name: Build ImmortalWrt for HINLINK H28K

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ImmortalWrt release tag，留空=自动取最新 stable release"
        required: false
        default: ""
  schedule:
    - cron: "0 20 * * 0"   # 每周一 04:00 (UTC+8) 自动跟一次最新 release

concurrency:
  group: h28k-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip python3-dev libpython3-dev \
            swig python3-pyelftools rsync unzip zlib1g-dev file wget cpio || true
          # U-Boot (RK3528) 打包需要 pyelftools；apt 装不上时用 pip 兜底
          python3 -c 'import elftools' 2>/dev/null || \
            python3 -m pip install --break-system-packages pyelftools
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)'

      - name: 编译固件
        env:
          TAG: ${{ inputs.tag }}
          JOBS: 4
        run: ./build.sh

      - name: 生成摘要
        if: always()
        run: |
          if [ -f out/build-info.txt ]; then
            cat out/build-info.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -lh out >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 校验镜像
        run: ./scripts/verify_image.sh out/*-ext4-sysupgrade.img.gz

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: immortalwrt-h28k
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL="${{ inputs.tag }}"
          [ -n "$REL" ] || REL="h28k-latest"
          if ! gh release view "$REL" >/dev/null 2>&1; then
            gh release create "$REL" --title "ImmortalWrt H28K ${REL}" \
              --notes "自动构建（$(date -u +%Y-%m-%d)），设备 HINLINK H28K / RK3528"
          fi
          gh release upload "$REL" out/*.gz out/sha256sums.txt out/build-info.txt --clobber
