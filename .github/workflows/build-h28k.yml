name: Build ImmortalWrt for HINLINK H28K

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ImmortalWrt release tag，留空=自动取最新 stable release"
        required: false
        default: ""
      variant:
        description: "固件版本：default=官方默认集，experience=Argon+主流插件全功能版"
        type: choice
        options:
          - default
          - experience
        default: default
  schedule:
    - cron: "0 20 * * 0"   # 每周一 04:00 (UTC+8) 自动跟一次最新 release

concurrency:
  group: h28k-build-${{ inputs.variant || 'default' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip python3-dev libpython3-dev \
            swig python3-pyelftools rsync unzip zlib1g-dev file wget cpio || true
          # U-Boot (RK3528) 打包需要 pyelftools；apt 装不上时用 pip 兜底
          python3 -c 'import elftools' 2>/dev/null || \
            python3 -m pip install --break-system-packages pyelftools
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)'

      - name: 编译固件
        env:
          TAG: ${{ inputs.tag }}
          JOBS: 4
          VARIANT: ${{ inputs.variant || 'default' }}
          CONFIG_SEED: ${{ inputs.variant == 'experience' && 'config/h28k-experience.config' || 'config/h28k.config' }}
        run: ./build.sh

      - name: 生成摘要
        if: always()
        run: |
          if [ -f out/build-info.txt ]; then
            cat out/build-info.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -lh out >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 校验镜像
        env:
          EXPECT_EXTRA: ${{ inputs.variant == 'experience' && 'luci-theme-argon luci-app-argon-config autosamba luci-app-samba4 luci-app-diskman luci-app-filemanager luci-app-dockerman luci-app-openclash' || '' }}
          EXPECT_ARGON: ${{ inputs.variant == 'experience' && '1' || '0' }}
          EXPECT_OPENCLASH: ${{ inputs.variant == 'experience' && '1' || '0' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          imgs=(out/*-ext4-sysupgrade.img.gz)
          [ "${#imgs[@]}" -gt 0 ] || { echo "没有找到 ext4 sysupgrade 镜像" >&2; exit 1; }
          for img in "${imgs[@]}"; do
            echo "== 校验 $img =="
            ./scripts/verify_image.sh "$img"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immortalwrt-h28k-${{ inputs.variant || 'default' }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: 发布 Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          VARIANT: ${{ inputs.variant || 'default' }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            default|experience) ;;
            *) echo "非法 variant: $VARIANT" >&2; exit 1 ;;
          esac
          REL="${INPUT_TAG:-}"
          if [ -n "$REL" ] && ! printf '%s' "$REL" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "非法 release tag: $REL" >&2; exit 1
          fi
          if [ -z "$REL" ]; then
            if [ "$VARIANT" = "experience" ]; then REL="h28k-experience"; else REL="h28k-latest"; fi
          fi
          if ! gh release view "$REL" >/dev/null 2>&1; then
            gh release create "$REL" --title "ImmortalWrt H28K ${REL}" \
              --notes "自动构建（$(date -u +%Y-%m-%d)），设备 HINLINK H28K / RK3528，variant=${VARIANT}"
          fi
          gh release upload "$REL" out/*.gz out/sha256sums.txt out/build-info.txt --clobber
